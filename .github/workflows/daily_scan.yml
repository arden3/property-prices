name: UB Property Prices CI & Digest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ub-prices with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest -v

      - name: Rebuild SQLite database and publish Job Summary
        run: |
          ub-prices build-db
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SQLite database artifact
        if: hashFiles('data/ub_prices.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ub-prices-sqlite-${{ github.run_id }}
          path: data/ub_prices.db
          retention-days: 30
