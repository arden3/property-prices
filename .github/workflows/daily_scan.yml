name: UB Property Prices CI & GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ub-prices with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest -v

      - name: Rebuild SQLite database, digest, and dashboard
        run: |
          ub-prices build-db
          ub-prices dashboard --output docs/index.html
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SQLite database artifact
        if: hashFiles('data/ub_prices.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ub-prices-sqlite-${{ github.run_id }}
          path: data/ub_prices.db
          retention-days: 30

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
