# Ulaanbaatar Family Property Price Tracker — Watchlist & Filter Configuration
# All 12 complexes are in Khan-Uul District (Marshall / Tuul River, Zaisan, 120 Myangat / National Park).

filters:
  # Mongolian room counts include the living room:
  # 3 өрөө = 2 bedrooms, 4 өрөө = 3 bedrooms, 5 өрөө = 4 bedrooms
  rooms_min: 3
  rooms_max: 5
  min_area_sqm: 60.0
  max_area_sqm: null

  # Allowed Unegui rubric slugs on search index pages (5-r is "5+ өрөө"; exact room count verified on detail)
  allowed_room_slugs:
    - "3-r"
    - "4-r"
    - "5-r"

  # Exclude commercial spaces, offices, standalone garages, and short-term/daily rentals
  exclude_keywords:
    - "үйлчилгээний талбай"
    - "үйлчилгээний зориулалттай"
    - "худалдаа үйлчилгээ"
    - "оффис"
    - "оффисын талбай"
    - "office"
    - "гараж зарна"
    - "граж зарна"
    - "дулаан зогсоол зарна"
    - "авто зогсоол зарна"
    - "зогсоол түрээслүүлнэ"
    - "граж түрээслүүлнэ"
    - "гараж түрээслүүлнэ"
    - "хоногийн түрээс"
    - "хоногоор"
    - "өдрөөр түрээслүүлнэ"
    - "өдрөөр хөлслүүлнэ"
    - "цагаар түрээслүүлнэ"

  # Hard title-only exclusions for standalone garages (allows apartments mentioning "зогсоолтой" / with parking)
  standalone_parking_patterns:
    - '^\s*(?:дулаан\s+)?(?:авто\s+)?(?:зогсоол|граж|гараж)\b'
    - '\b(?:дулаан\s+)?(?:авто\s+)?(?:зогсоол|граж|гараж)\s+(?:зарна|худалдана|түрээслүүлнэ)\b'

  # Mongolian proximity words immediately following a complex name that indicate a neighboring building
  proximity_words:
    - "хажууд"
    - "хажуугийн"
    - "ойролцоо"
    - "ойрхон"
    - "ойр"
    - "дэргэд"
    - "залгаа"
    - "эсрэг талд"
    - "урд талд"
    - "хойд талд"
    - "зүүн талд"
    - "баруун талд"
    - "чанга урд"
    - "чанга ард"
    - "яг урд"
    - "яг ард"
    - "яг хажууд"
    - "урд"
    - "ард"
    - "хойд"

